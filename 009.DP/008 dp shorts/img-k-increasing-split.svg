<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="260" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">arr = [5,1,6,2,8], k = 2 &#8212; split by index mod k into two independent chains</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" font-size="18" fill="#d4d4d4">
    <text x="100" y="90">5</text>
    <text x="230" y="90">1</text>
    <text x="360" y="90">6</text>
    <text x="490" y="90">2</text>
    <text x="620" y="90">8</text>
  </g>
  <g font-size="12" fill="#9aa0a6" text-anchor="middle">
    <text x="100" y="115">idx 0</text>
    <text x="230" y="115">idx 1</text>
    <text x="360" y="115">idx 2</text>
    <text x="490" y="115">idx 3</text>
    <text x="620" y="115">idx 4</text>
  </g>

  <path d="M100,75 Q230,20 360,75" stroke="#56c98d" stroke-width="2" fill="none"/>
  <path d="M360,75 Q490,20 620,75" stroke="#56c98d" stroke-width="2" fill="none"/>
  <path d="M230,75 Q360,140 490,75" stroke="#5b9bd5" stroke-width="2" fill="none"/>

  <rect x="60" y="150" width="330" height="45" fill="#1f3a2e" stroke="#56c98d" stroke-width="1.5" rx="6"/>
  <text x="225" y="177" fill="#56c98d" text-anchor="middle" font-family="monospace">chain (idx 0,2,4): 5, 6, 8</text>

  <rect x="420" y="150" width="260" height="45" fill="#1f2a3a" stroke="#5b9bd5" stroke-width="1.5" rx="6"/>
  <text x="550" y="177" fill="#5b9bd5" text-anchor="middle" font-family="monospace">chain (idx 1,3): 1, 2</text>

  <rect x="25" y="210" width="750" height="40" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="234" fill="#d4d4d4" font-size="12.5">Both chains are already non-decreasing here &#8594; 0 operations needed. In general: answer = n &#8722; (sum of each chain's Longest Non-Decreasing Subsequence).</text>
</svg>
