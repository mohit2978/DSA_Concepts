<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="380" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Diagonal Traversal &#8212; a right child stays on the SAME diagonal; a left child starts the NEXT one</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g stroke="#5b9bd5" stroke-width="2">
    <line x1="230" y1="70" x2="120" y2="140"/>
    <line x1="230" y1="70" x2="500" y2="140"/>
    <line x1="120" y1="140" x2="180" y2="210"/>
    <line x1="500" y1="140" x2="600" y2="210"/>
    <line x1="180" y1="210" x2="240" y2="280"/>
    <line x1="600" y1="210" x2="540" y2="280"/>
  </g>

  <g>
    <circle cx="230" cy="60" r="18" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="120" cy="140" r="18" fill="#252525" stroke="#56c98d" stroke-width="2.5"/>
    <circle cx="500" cy="140" r="18" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="180" cy="210" r="18" fill="#252323" stroke="#e06c75" stroke-width="2.5"/>
    <circle cx="600" cy="210" r="18" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="240" cy="280" r="18" fill="#252323" stroke="#e06c75" stroke-width="2.5"/>
    <circle cx="540" cy="280" r="18" fill="#252525" stroke="#56c98d" stroke-width="2.5"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="230" y="65">8</text>
    <text x="120" y="145">3</text>
    <text x="500" y="145">10</text>
    <text x="180" y="215">1</text>
    <text x="600" y="215">14</text>
    <text x="240" y="285">4</text>
    <text x="540" y="285">13</text>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <circle cx="360" cy="210" r="18" fill="#252525" stroke="#56c98d" stroke-width="2.5"/>
    <text x="360" y="215">6</text>
    <circle cx="420" cy="280" r="18" fill="#252525" stroke="#56c98d" stroke-width="2.5"/>
    <text x="420" y="285">7</text>
  </g>
  <line x1="120" y1="140" x2="360" y2="210" stroke="#5b9bd5" stroke-width="2"/>
  <line x1="360" y1="210" x2="420" y2="280" stroke="#5b9bd5" stroke-width="2"/>

  <rect x="25" y="310" width="750" height="60" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="332" fill="#f2c14e" font-size="12.5"><tspan font-weight="bold">Diagonal 0</tspan> (gold): 8, 10, 14 &#8212; every right-child hop.</text>
  <text x="40" y="354" fill="#56c98d" font-size="12.5"><tspan font-weight="bold">Diagonal 1</tspan> (green): 3, 6, 7, 13 &#8212; left child of 8, then its right-chain, plus left child of 14.</text>
</svg>
